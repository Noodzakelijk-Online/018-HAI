<section class="login-page">
  <div class="login-copy">
    <span class="login-mark">HAI</span>
    <h1>HAI Automation Hub</h1>
    <p>Sign in to your local-first personal operations command center.</p>
    <div class="login-signal">
      <i nz-icon nzType="safety-certificate" nzTheme="outline"></i>
      <span>
        <strong>Safe mode by default</strong>
        <small>High-risk actions remain approval-gated.</small>
      </span>
    </div>
  </div>

  <form
    nz-form
    [formGroup]="validateForm"
    (ngSubmit)="submitForm()"
    class="login-box"
  >
    <div class="login-box__header">
      <h2>Log in</h2>
      <span>Use the local admin account from your environment file.</span>
    </div>

    <nz-form-item>
      <nz-form-control
        nzErrorTip="Please input your email!"
        nzHasFeedback
        [nzValidateStatus]="validateForm.controls['userName']"
      >
        <nz-input-group nzPrefixIcon="mail">
          <input
            type="email"
            nz-input
            formControlName="userName"
            placeholder="Email"
          />
        </nz-input-group>
      </nz-form-control>
    </nz-form-item>

    <nz-form-item>
      <nz-form-control
        nzErrorTip="Please input your password!"
        nzHasFeedback
        [nzValidateStatus]="validateForm.controls['password']"
      >
        <nz-input-group nzPrefixIcon="lock" [nzSuffix]="suffixIcon">
          <input
            type="password"
            nz-input
            formControlName="password"
            placeholder="Password"
            [type]="hidePassword ? 'password' : 'text'"
          />
        </nz-input-group>

        <ng-template #suffixIcon>
          <i
            nz-icon
            [nzType]="hidePassword ? 'eye-invisible' : 'eye'"
            (click)="hidePassword = !hidePassword"
          ></i>
        </ng-template>
      </nz-form-control>
    </nz-form-item>

    <nz-form-control>
      <div class="login-options">
      <label nz-checkbox formControlName="remember">
        <span>Remember me</span>
      </label>
      <button
        type="button"
        class="login-form-forgot"
        data-testid="login-password-help"
        (click)="showPasswordHelp()"
      >
        Forgot password?
      </button>
      </div>
      <button
        type="submit"
        nz-button
        class="login-form-button"
        [nzType]="'primary'"
        data-testid="login-submit"
      >
        Log in
      </button>
    </nz-form-control>
  </form>
</section>
