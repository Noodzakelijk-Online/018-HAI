# Canonical Compose entry point.
#
# This keeps `docker compose up --build` on the source-built, local-first HAI
# stack. The retired stack in this path previously pulled unrelated upstream
# images and started an unsafe multi-broker topology.
#
# Docker Compose `include` requires Compose 2.20 or later. The Windows
# installer already requires current Docker Desktop; operators on older Compose
# releases can invoke `-f docker-compose.local.yml` directly.
include:
  - path: ./docker-compose.local.yml
