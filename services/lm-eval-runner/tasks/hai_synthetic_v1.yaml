task: hai_synthetic_v1
dataset_path: json
dataset_kwargs:
  data_files:
    test: /app/tasks/hai_synthetic_v1.json
test_split: test
output_type: generate_until
doc_to_text: "Return only the required answer with no explanation.\nTask: {{prompt}}\nAnswer:"
doc_to_target: "{{target}}"
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
generation_kwargs:
  until:
    - "\n"
  do_sample: false
  temperature: 0
metadata:
  version: 1
