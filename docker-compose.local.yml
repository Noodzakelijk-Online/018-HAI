      ODYSSEUS_AGENT_ALLOW_BASH: ${ODYSSEUS_AGENT_ALLOW_BASH}
      ODYSSEUS_AGENT_ALLOW_WEB_SEARCH: ${ODYSSEUS_AGENT_ALLOW_WEB_SEARCH}
