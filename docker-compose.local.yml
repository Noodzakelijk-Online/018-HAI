      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_STATE_DIR: ${OPENCLAW_STATE_DIR}
      OPENCLAW_CONFIG_PATH: ${OPENCLAW_CONFIG_PATH}
      OPENCLAW_ECOSYSTEM_PATH: ${OPENCLAW_ECOSYSTEM_PATH}
      OPENCLAW_WORKSPACE: ${OPENCLAW_WORKSPACE}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS}
      OPENCLAW_THINKING: ${OPENCLAW_THINKING}
      OPENCLAW_ENV_ALLOWLIST: ${OPENCLAW_ENV_ALLOWLIST}
      OPENCLAW_AGENT_CLI_ENABLED: ${OPENCLAW_AGENT_CLI_ENABLED}
      OPENCLAW_GATEWAY_ENABLED: ${OPENCLAW_GATEWAY_ENABLED}
      OPENCLAW_MESSAGES_ENABLED: ${OPENCLAW_MESSAGES_ENABLED}
      OPENCLAW_SKILLS_ENABLED: ${OPENCLAW_SKILLS_ENABLED}
      OPENCLAW_PLUGINS_ENABLED: ${OPENCLAW_PLUGINS_ENABLED}
      OPENCLAW_MCP_ENABLED: ${OPENCLAW_MCP_ENABLED}
      OPENCLAW_MEMORY_ENABLED: ${OPENCLAW_MEMORY_ENABLED}
      OPENCLAW_CRON_ENABLED: ${OPENCLAW_CRON_ENABLED}
