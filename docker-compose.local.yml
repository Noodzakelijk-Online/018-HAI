services:
  idp:
    build:
      context: ./idp
      dockerfile: Dockerfile
    container_name: 018-hai-idp
    hostname: idp
    restart: unless-stopped
    depends_on:
      postgres-idp:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BLOCKING_TIME_EXPONENTIATION_BASIS: ${BLOCKING_TIME_EXPONENTIATION_BASIS}
      MAX_LOGIN_ATTEMPTS_BEFORE_BLOCK: ${MAX_LOGIN_ATTEMPTS_BEFORE_BLOCK}
      MIN_TIME_BETWEEN_ATTEMPTS_IN_SECONDS: ${MIN_TIME_BETWEEN_ATTEMPTS_IN_SECONDS}
      EXPIRATION_TIME_RESET_TOKEN_IN_HOURS: ${EXPIRATION_TIME_RESET_TOKEN_IN_HOURS}
      ACCESS_TOKEN_DURATION_MINUTES: ${ACCESS_TOKEN_DURATION_MINUTES}
      REFRESH_TOKEN_DURATION_DAYS: ${REFRESH_TOKEN_DURATION_DAYS}
      PASSWORD_RESET_TOPIC: ${PASSWORD_RESET_TOPIC}
      ACCOUNT_BLOCKED_TOPIC: ${ACCOUNT_BLOCKED_TOPIC}
      ACCOUNT_CREATED_TOPIC: ${ACCOUNT_CREATED_TOPIC}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADDR: ${REDIS_ADDR}
      LOGGER_TOPIC: ${LOGGER_TOPIC}
      MAIL_TOPIC: ${MAIL_TOPIC}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID}
      BROKERS_ADDR: ${BROKERS_ADDR}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${IDP_DB_NAME}
      DB_HOST: ${IDP_DB_HOST}
      DB_PORT: ${DB_PORT}
      WEB_SERVER_PORT: ${WEB_SERVER_PORT}
      BASE_URL: ${BASE_URL}
      FIRST_RUN_ADMIN_EMAIL: ${FIRST_RUN_ADMIN_EMAIL}
      FIRST_RUN_ADMIN_PASSWORD: ${FIRST_RUN_ADMIN_PASSWORD}
      IDP_COOKIE_SECURE: ${IDP_COOKIE_SECURE}
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/${WEB_SERVER_PORT}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - service-hub
      - idp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 018-hai-backend
    hostname: backend
    restart: unless-stopped
    depends_on:
      postgres-automation:
        condition: service_healthy
      kafka:
        condition: service_healthy
      idp:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT}
      BASE_URL: ${BASE_URL}
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
      HAI_MEMORY_ENCRYPTION_KEY: ${HAI_MEMORY_ENCRYPTION_KEY}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${AUTOMATION_DB_NAME}
      DB_HOST: ${AUTOMATION_DB_HOST}
      DB_PORT: ${DB_PORT}
      IMAGE_MAX_SIZE_IN_MB: ${IMAGE_MAX_SIZE_IN_MB}
      IMAGE_EXTENSIONS: ${IMAGE_EXTENSIONS}
      IMAGE_SAVE_DIR: ${IMAGE_SAVE_DIR}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      REDIS_ADDR: ${REDIS_ADDR}
      # Shared with the IDP so identityMiddleware can verify IDP-issued JWTs.
      # Without it the backend cannot validate per-user tokens and silently
      # falls back to the shared-key single-operator model.
      JWT_SECRET: ${JWT_SECRET}
      RUN_MODE: ${RUN_MODE}
      LLM_POLICY_JSON: ${LLM_POLICY_JSON}
      LLM_PROVIDERS_JSON: ${LLM_PROVIDERS_JSON}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL}
      ODYSSEUS_BASE_URL: ${ODYSSEUS_BASE_URL}
      ODYSSEUS_API_TOKEN: ${ODYSSEUS_API_TOKEN}
      AGENT_RUNTIME_ALLOWED_HOSTS: ${AGENT_RUNTIME_ALLOWED_HOSTS}
      AGENT_RUNTIME_OUTPUT_LIMIT_BYTES: ${AGENT_RUNTIME_OUTPUT_LIMIT_BYTES}
      AGENT_RUNTIME_WORKSPACE_ROOT: ${AGENT_RUNTIME_WORKSPACE_ROOT}
      ODYSSEUS_AGENT_ENABLED: ${ODYSSEUS_AGENT_ENABLED}
      ODYSSEUS_AGENT_SESSION_ID: ${ODYSSEUS_AGENT_SESSION_ID}
      ODYSSEUS_AGENT_WORKSPACE: ${ODYSSEUS_AGENT_WORKSPACE}
      ODYSSEUS_AGENT_TIMEOUT_SECONDS: ${ODYSSEUS_AGENT_TIMEOUT_SECONDS}
      ODYSSEUS_CODEX_BRIDGE_ENABLED: ${ODYSSEUS_CODEX_BRIDGE_ENABLED}
      ODYSSEUS_CLAUDE_BRIDGE_ENABLED: ${ODYSSEUS_CLAUDE_BRIDGE_ENABLED}
      ODYSSEUS_TODOS_ENABLED: ${ODYSSEUS_TODOS_ENABLED}
      ODYSSEUS_NOTES_ENABLED: ${ODYSSEUS_NOTES_ENABLED}
      ODYSSEUS_TASKS_ENABLED: ${ODYSSEUS_TASKS_ENABLED}
      ODYSSEUS_EMAIL_ENABLED: ${ODYSSEUS_EMAIL_ENABLED}
      ODYSSEUS_CALENDAR_ENABLED: ${ODYSSEUS_CALENDAR_ENABLED}
      ODYSSEUS_CONTACTS_ENABLED: ${ODYSSEUS_CONTACTS_ENABLED}
      ODYSSEUS_DOCUMENTS_ENABLED: ${ODYSSEUS_DOCUMENTS_ENABLED}
      ODYSSEUS_MEMORY_SYNC_ENABLED: ${ODYSSEUS_MEMORY_SYNC_ENABLED}
      ODYSSEUS_RESEARCH_ENABLED: ${ODYSSEUS_RESEARCH_ENABLED}
      ODYSSEUS_SEARCH_ENABLED: ${ODYSSEUS_SEARCH_ENABLED}
      ODYSSEUS_MCP_ENABLED: ${ODYSSEUS_MCP_ENABLED}
      ODYSSEUS_COOKBOOK_ENABLED: ${ODYSSEUS_COOKBOOK_ENABLED}
      ODYSSEUS_LOCAL_MODEL_DISCOVERY_ENABLED: ${ODYSSEUS_LOCAL_MODEL_DISCOVERY_ENABLED}
      ODYSSEUS_SHELL_ENABLED: ${ODYSSEUS_SHELL_ENABLED}
      ODYSSEUS_BROWSER_ENABLED: ${ODYSSEUS_BROWSER_ENABLED}
      ODYSSEUS_VAULT_ENABLED: ${ODYSSEUS_VAULT_ENABLED}
      ODYSSEUS_GALLERY_ENABLED: ${ODYSSEUS_GALLERY_ENABLED}
      ODYSSEUS_TTS_ENABLED: ${ODYSSEUS_TTS_ENABLED}
      ODYSSEUS_STT_ENABLED: ${ODYSSEUS_STT_ENABLED}
      ODYSSEUS_COMPANION_ENABLED: ${ODYSSEUS_COMPANION_ENABLED}
      ODYSSEUS_WEBHOOKS_ENABLED: ${ODYSSEUS_WEBHOOKS_ENABLED}
      ODYSSEUS_AGENT_MIGRATION_ENABLED: ${ODYSSEUS_AGENT_MIGRATION_ENABLED}
      ODYSSEUS_CONTEXT_BUDGET_ENABLED: ${ODYSSEUS_CONTEXT_BUDGET_ENABLED}
      ODYSSEUS_AGENT_ALLOW_BASH: ${ODYSSEUS_AGENT_ALLOW_BASH}
      ODYSSEUS_AGENT_ALLOW_WEB_SEARCH: ${ODYSSEUS_AGENT_ALLOW_WEB_SEARCH}
      ODYSSEUS_AGENT_ALLOW_RESEARCH: ${ODYSSEUS_AGENT_ALLOW_RESEARCH}
      HERMES_AGENT_ENABLED: ${HERMES_AGENT_ENABLED}
      HERMES_EXECUTABLE: ${HERMES_EXECUTABLE}
      HERMES_HOME: ${HERMES_HOME}
      HERMES_PROFILE: ${HERMES_PROFILE}
      HERMES_IGNORE_USER_CONFIG: ${HERMES_IGNORE_USER_CONFIG}
      HERMES_WORKSPACE: ${HERMES_WORKSPACE}
      HERMES_MAX_TURNS: ${HERMES_MAX_TURNS}
      HERMES_TIMEOUT_SECONDS: ${HERMES_TIMEOUT_SECONDS}
      HERMES_TOOLSETS: ${HERMES_TOOLSETS}
      HERMES_SKILLS: ${HERMES_SKILLS}
      HERMES_GATEWAY_ENABLED: ${HERMES_GATEWAY_ENABLED}
      HERMES_CRON_ENABLED: ${HERMES_CRON_ENABLED}
      HERMES_MCP_ENABLED: ${HERMES_MCP_ENABLED}
      HERMES_MOA_ENABLED: ${HERMES_MOA_ENABLED}
      HERMES_SUBAGENTS_ENABLED: ${HERMES_SUBAGENTS_ENABLED}
      HERMES_MEMORY_SYNC_ENABLED: ${HERMES_MEMORY_SYNC_ENABLED}
      HERMES_ACP_ENABLED: ${HERMES_ACP_ENABLED}
      HERMES_TERMINAL_BACKENDS: ${HERMES_TERMINAL_BACKENDS}
      HERMES_ENV_ALLOWLIST: ${HERMES_ENV_ALLOWLIST}
      OPENCLAW_AGENT_ENABLED: ${OPENCLAW_AGENT_ENABLED}
      OPENCLAW_EXECUTABLE: ${OPENCLAW_EXECUTABLE}
      OPENCLAW_GATEWAY_URL: ${OPENCLAW_GATEWAY_URL}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_STATE_DIR: ${OPENCLAW_STATE_DIR}
      OPENCLAW_CONFIG_PATH: ${OPENCLAW_CONFIG_PATH}
      OPENCLAW_ECOSYSTEM_PATH: ${OPENCLAW_ECOSYSTEM_PATH}
      OPENCLAW_WORKSPACE: ${OPENCLAW_WORKSPACE}
      OPENCLAW_TIMEOUT_SECONDS: ${OPENCLAW_TIMEOUT_SECONDS}
      OPENCLAW_THINKING: ${OPENCLAW_THINKING}
      OPENCLAW_ENV_ALLOWLIST: ${OPENCLAW_ENV_ALLOWLIST}
      OPENCLAW_AGENT_CLI_ENABLED: ${OPENCLAW_AGENT_CLI_ENABLED}
      OPENCLAW_GATEWAY_ENABLED: ${OPENCLAW_GATEWAY_ENABLED}
      OPENCLAW_MESSAGES_ENABLED: ${OPENCLAW_MESSAGES_ENABLED}
      OPENCLAW_SKILLS_ENABLED: ${OPENCLAW_SKILLS_ENABLED}
      OPENCLAW_PLUGINS_ENABLED: ${OPENCLAW_PLUGINS_ENABLED}
      OPENCLAW_MCP_ENABLED: ${OPENCLAW_MCP_ENABLED}
      OPENCLAW_MEMORY_ENABLED: ${OPENCLAW_MEMORY_ENABLED}
      OPENCLAW_CRON_ENABLED: ${OPENCLAW_CRON_ENABLED}
      OPENCLAW_BROWSER_ENABLED: ${OPENCLAW_BROWSER_ENABLED}
      OPENCLAW_CANVAS_ENABLED: ${OPENCLAW_CANVAS_ENABLED}
      OPENCLAW_NODES_ENABLED: ${OPENCLAW_NODES_ENABLED}
      OPENCLAW_VOICE_ENABLED: ${OPENCLAW_VOICE_ENABLED}
      OPENCLAW_TALK_ENABLED: ${OPENCLAW_TALK_ENABLED}
      OPENCLAW_WEBCHAT_ENABLED: ${OPENCLAW_WEBCHAT_ENABLED}
      OPENCLAW_PAIRING_ENABLED: ${OPENCLAW_PAIRING_ENABLED}
      OPENCLAW_EXEC_APPROVALS_ENABLED: ${OPENCLAW_EXEC_APPROVALS_ENABLED}
      OPENCLAW_HOST_TOOLS_ENABLED: ${OPENCLAW_HOST_TOOLS_ENABLED}
      OPENCLAW_PUBLIC_POSTING_ENABLED: ${OPENCLAW_PUBLIC_POSTING_ENABLED}
      OPENCLAW_WEB_SEARCH_ENABLED: ${OPENCLAW_WEB_SEARCH_ENABLED}
      OPENCLAW_MULTI_AGENT_ENABLED: ${OPENCLAW_MULTI_AGENT_ENABLED}
      OPENCLAW_APP_SDK_ENABLED: ${OPENCLAW_APP_SDK_ENABLED}
      OPENCLAW_PLUGIN_SDK_ENABLED: ${OPENCLAW_PLUGIN_SDK_ENABLED}
      OPENCLAW_LOCAL_MODELS_ENABLED: ${OPENCLAW_LOCAL_MODELS_ENABLED}
      OPENCLAW_ALLOW_HIGH_RISK_EXECUTION: ${OPENCLAW_ALLOW_HIGH_RISK_EXECUTION}
      OPENCLAW_SANDBOX_REQUIRED: ${OPENCLAW_SANDBOX_REQUIRED}
      OPENCLAW_SANDBOX_MODE: ${OPENCLAW_SANDBOX_MODE}
      OPENCLAW_SANDBOX_DOCKER_ENABLED: ${OPENCLAW_SANDBOX_DOCKER_ENABLED}
      OPENCLAW_SANDBOX_SSH_ENABLED: ${OPENCLAW_SANDBOX_SSH_ENABLED}
      OPENCLAW_SANDBOX_OPENSHELL_ENABLED: ${OPENCLAW_SANDBOX_OPENSHELL_ENABLED}
      OPENCLAW_CHANNELS_ENABLED: ${OPENCLAW_CHANNELS_ENABLED}
      OPENCLAW_PROVIDERS_ENABLED: ${OPENCLAW_PROVIDERS_ENABLED}
      OPENCLAW_COMPANION_APPS: ${OPENCLAW_COMPANION_APPS}
      FREE_CLOUD_OPENAI_BASE_URL: ${FREE_CLOUD_OPENAI_BASE_URL}
      FREE_CLOUD_API_KEY: ${FREE_CLOUD_API_KEY}
      LLM_GENERATION_TIMEOUT_SECONDS: ${LLM_GENERATION_TIMEOUT_SECONDS}
      LLM_ALLOW_LINK_LOCAL_ENDPOINTS: ${LLM_ALLOW_LINK_LOCAL_ENDPOINTS}
      AUTOMATION_API_ALLOWED_HOSTS: ${AUTOMATION_API_ALLOWED_HOSTS}
      AUTOMATION_API_ALLOW_LINK_LOCAL: ${AUTOMATION_API_ALLOW_LINK_LOCAL}
      AUTOMATION_HEALTH_ALLOWED_HOSTS: ${AUTOMATION_HEALTH_ALLOWED_HOSTS}
      AUTOMATION_HEALTH_ALLOW_LINK_LOCAL: ${AUTOMATION_HEALTH_ALLOW_LINK_LOCAL}
      AUTOMATION_SCRIPT_EXECUTION_ENABLED: ${AUTOMATION_SCRIPT_EXECUTION_ENABLED}
      AUTOMATION_SCRIPT_DIR: ${AUTOMATION_SCRIPT_DIR}
      AUTOMATION_SCRIPT_TIMEOUT_SECONDS: ${AUTOMATION_SCRIPT_TIMEOUT_SECONDS}
      AUTOMATION_SCRIPT_ENV_ALLOWLIST: ${AUTOMATION_SCRIPT_ENV_ALLOWLIST}
      AUTOMATION_DOCKER_CONTROL_ENABLED: ${AUTOMATION_DOCKER_CONTROL_ENABLED}
      AUTOMATION_DOCKER_SOCKET: ${AUTOMATION_DOCKER_SOCKET}
      AUTOMATION_DOCKER_ALLOWED_CONTAINERS: ${AUTOMATION_DOCKER_ALLOWED_CONTAINERS}
      CONNECTED_SOURCE_LOCAL_ROOT: ${CONNECTED_SOURCE_LOCAL_ROOT}
      CONNECTED_SOURCE_FILE_LIMIT: ${CONNECTED_SOURCE_FILE_LIMIT}
      CONNECTED_SOURCE_MAX_BYTES: ${CONNECTED_SOURCE_MAX_BYTES}
      CONNECTED_SOURCE_HTTP_ALLOWED_HOSTS: ${CONNECTED_SOURCE_HTTP_ALLOWED_HOSTS}
      CONNECTED_SOURCE_HTTP_ALLOW_LINK_LOCAL: ${CONNECTED_SOURCE_HTTP_ALLOW_LINK_LOCAL}
      CONNECTED_SOURCE_HTTP_TIMEOUT_SECONDS: ${CONNECTED_SOURCE_HTTP_TIMEOUT_SECONDS}
      CONNECTED_SOURCE_HTTP_MAX_BYTES: ${CONNECTED_SOURCE_HTTP_MAX_BYTES}
      GITHUB_SOURCE_API_BASE_URL: ${GITHUB_SOURCE_API_BASE_URL}
      GITHUB_SOURCE_TOKEN: ${GITHUB_SOURCE_TOKEN}
      SOURCE_SCHEDULER_ENABLED: ${SOURCE_SCHEDULER_ENABLED}
      SOURCE_SCHEDULER_INTERVAL_SECONDS: ${SOURCE_SCHEDULER_INTERVAL_SECONDS}
      SOURCE_SCHEDULER_RUN_ON_STARTUP: ${SOURCE_SCHEDULER_RUN_ON_STARTUP}
      WORKFLOW_SCHEDULER_ENABLED: ${WORKFLOW_SCHEDULER_ENABLED}
      WORKFLOW_OPEN_LOOP_SCHEDULER_ENABLED: ${WORKFLOW_OPEN_LOOP_SCHEDULER_ENABLED}
      WORKFLOW_SCHEDULER_INTERVAL_SECONDS: ${WORKFLOW_SCHEDULER_INTERVAL_SECONDS}
      WORKFLOW_SCHEDULER_RUN_LIMIT: ${WORKFLOW_SCHEDULER_RUN_LIMIT}
      WORKFLOW_SCHEDULER_RUN_ON_STARTUP: ${WORKFLOW_SCHEDULER_RUN_ON_STARTUP}
      WORKFLOW_CLAIM_LEASE_SECONDS: ${WORKFLOW_CLAIM_LEASE_SECONDS}
      AMBIENT_SCHEDULER_ENABLED: ${AMBIENT_SCHEDULER_ENABLED}
      AMBIENT_EXECUTION_ENABLED: ${AMBIENT_EXECUTION_ENABLED}
      AMBIENT_RUN_ON_STARTUP: ${AMBIENT_RUN_ON_STARTUP}
      AMBIENT_SCAN_INTERVAL_SECONDS: ${AMBIENT_SCAN_INTERVAL_SECONDS}
      AMBIENT_MINIMUM_SCORE: ${AMBIENT_MINIMUM_SCORE}
      AMBIENT_MINIMUM_CONFIDENCE: ${AMBIENT_MINIMUM_CONFIDENCE}
      AMBIENT_OPPORTUNITY_LIMIT: ${AMBIENT_OPPORTUNITY_LIMIT}
      AMBIENT_EXECUTION_LIMIT: ${AMBIENT_EXECUTION_LIMIT}
      AMBIENT_DISMISS_COOLDOWN_HOURS: ${AMBIENT_DISMISS_COOLDOWN_HOURS}
      AMBIENT_SCAN_RETENTION: ${AMBIENT_SCAN_RETENTION}
      AUTONOMY_WORLD_STATE_TTL_SECONDS: ${AUTONOMY_WORLD_STATE_TTL_SECONDS}
      AUTONOMY_TELEMETRY_LIMIT: ${AUTONOMY_TELEMETRY_LIMIT}
      LLM_KV_CACHE_LOAD_STRATEGY: ${LLM_KV_CACHE_LOAD_STRATEGY}
      LLM_DUALPATH_INFRASTRUCTURE_VERIFIED: ${LLM_DUALPATH_INFRASTRUCTURE_VERIFIED}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${SERVER_PORT}"
    volumes:
      - ./images:/root/images
      - ./automation-scripts:/root/automation-scripts:ro
      - ./connected-sources:/root/connected-sources:ro
      - ./agent-workspaces:/root/agent-workspaces
    # /readyz, not a TCP probe: an open socket only proves the process is
    # listening. curl -f fails on the 503 that /readyz returns when a critical
    # dependency is unreachable, so `docker ps` stops reporting a backend with a
    # dead database as healthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT}/readyz > /dev/null"]
      interval: 10s
      timeout: 5s
      # 3 strikes (~30s) before unhealthy: long enough to ride out a dependency
      # blip, short enough that a real outage is reflected quickly. start_period
      # still covers the slower first boot while migrations run.
      retries: 3
      start_period: 40s
    networks:
      - service-hub
      - automation-hub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 018-hai-frontend
    hostname: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  nginx:
    image: nginx:alpine
    container_name: gateway
    hostname: gateway
    restart: unless-stopped
    environment:
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
    command:
      - /bin/sh
      - -c
      - envsubst '$$BACKEND_API_SHARED_KEY' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
      idp:
        condition: service_started
    ports:
      - "${GATEWAY_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx-config/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx-config/sites-enabled:/etc/nginx/sites-enabled:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  nginxconfigmanager:
    build:
      context: ./nginx-config-manager
      dockerfile: Dockerfile
    container_name: 018-hai-nginx-config-manager
    restart: unless-stopped
    environment:
      BROKERS_ADDR: ${BROKERS_ADDR}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      NGINX_CONTAINER: ${NGINX_CONTAINER}
      CONFIG_DIR: ${CONFIG_DIR}
      NGINX_RELOAD_ENABLED: ${NGINX_RELOAD_ENABLED}
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    volumes:
      - ./nginx-config/sites-enabled:/app/sites-enabled
    networks:
      - service-hub

  postgres-idp:
    image: postgres:17-alpine
    container_name: 018-hai-postgres-idp
    hostname: postgres-idp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${IDP_DB_NAME}
    ports:
      - "127.0.0.1:${IDP_DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-idp-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${IDP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - idp-network

  postgres-automation:
    image: postgres:17-alpine
    container_name: 018-hai-postgres-automation
    hostname: postgres-automation
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTOMATION_DB_NAME}
    ports:
      - "127.0.0.1:${AUTOMATION_DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-automation-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${AUTOMATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - automation-hub-network

  redis:
    image: redis:7-alpine
    container_name: 018-hai-redis
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      # Also on automation-hub-network so the backend can reach it: Redis was
      # previously idp-network only, unreachable from the backend, which is why
      # nothing but the IDP ever used it.
      - idp-network
      - automation-hub-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: 018-hai-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${ZOOKEEPER_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: 018-hai-kafka
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_LISTENERS: INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - kafka-network
      - service-hub

  generic-auto:
    build:
      context: ./generic-auto
      dockerfile: dockerfile
    container_name: 018-hai-generic-auto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - service-hub

networks:
  idp-network:
    name: 018-hai-idp-network
