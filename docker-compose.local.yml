services:
  idp:
    build:
      context: ./idp
      dockerfile: Dockerfile
    container_name: 018-hai-idp
    hostname: idp
    restart: unless-stopped
    depends_on:
      postgres-idp:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      BLOCKING_TIME_EXPONENTIATION_BASIS: ${BLOCKING_TIME_EXPONENTIATION_BASIS}
      MAX_LOGIN_ATTEMPTS_BEFORE_BLOCK: ${MAX_LOGIN_ATTEMPTS_BEFORE_BLOCK}
      MIN_TIME_BETWEEN_ATTEMPTS_IN_SECONDS: ${MIN_TIME_BETWEEN_ATTEMPTS_IN_SECONDS}
      EXPIRATION_TIME_RESET_TOKEN_IN_HOURS: ${EXPIRATION_TIME_RESET_TOKEN_IN_HOURS}
      ACCESS_TOKEN_DURATION_MINUTES: ${ACCESS_TOKEN_DURATION_MINUTES}
      REFRESH_TOKEN_DURATION_DAYS: ${REFRESH_TOKEN_DURATION_DAYS}
      PASSWORD_RESET_TOPIC: ${PASSWORD_RESET_TOPIC}
      ACCOUNT_BLOCKED_TOPIC: ${ACCOUNT_BLOCKED_TOPIC}
      ACCOUNT_CREATED_TOPIC: ${ACCOUNT_CREATED_TOPIC}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_ADDR: ${REDIS_ADDR}
      LOGGER_TOPIC: ${LOGGER_TOPIC}
      MAIL_TOPIC: ${MAIL_TOPIC}
      KAFKA_CLIENT_ID: ${KAFKA_CLIENT_ID}
      BROKERS_ADDR: ${BROKERS_ADDR}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${IDP_DB_NAME}
      DB_HOST: ${IDP_DB_HOST}
      DB_PORT: ${DB_PORT}
      WEB_SERVER_PORT: ${WEB_SERVER_PORT}
      BASE_URL: ${BASE_URL}
      FIRST_RUN_ADMIN_EMAIL: ${FIRST_RUN_ADMIN_EMAIL}
      FIRST_RUN_ADMIN_PASSWORD: ${FIRST_RUN_ADMIN_PASSWORD}
      IDP_COOKIE_SECURE: ${IDP_COOKIE_SECURE}
      LOCAL_LOGIN_BYPASS_ENABLED: ${LOCAL_LOGIN_BYPASS_ENABLED:-false}
      # "Sign in with Google": the client id/secret are shared with the backend's
      # Gmail connector, but the login redirect is a distinct path routed to the
      # IDP, so it needs its own registered redirect URI on the Google app.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_LOGIN_REDIRECT_URL: ${GOOGLE_LOGIN_REDIRECT_URL:-}
      # Password-recovery mail is unavailable until these are configured.
      # Use STARTTLS (normally port 587); do not expose this account publicly.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_STARTTLS: ${SMTP_REQUIRE_STARTTLS:-true}
    healthcheck:
      test: ["CMD-SHELL", "bash -ec '</dev/tcp/127.0.0.1/${WEB_SERVER_PORT}'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - service-hub
      - idp-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: 018-hai-backend
    hostname: backend
    restart: unless-stopped
    depends_on:
      postgres-automation:
        condition: service_healthy
      kafka:
        condition: service_healthy
      idp:
        condition: service_started
    environment:
      SERVER_PORT: ${SERVER_PORT}
      BASE_URL: ${BASE_URL}
      JWT_SECRET: ${JWT_SECRET}
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
      HAI_MEMORY_ENCRYPTION_KEY: ${HAI_MEMORY_ENCRYPTION_KEY}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: ${AUTOMATION_DB_NAME}
      DB_HOST: ${AUTOMATION_DB_HOST}
      DB_PORT: ${DB_PORT}
      IMAGE_MAX_SIZE_IN_MB: ${IMAGE_MAX_SIZE_IN_MB}
      IMAGE_EXTENSIONS: ${IMAGE_EXTENSIONS}
      IMAGE_SAVE_DIR: ${IMAGE_SAVE_DIR}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      REDIS_ADDR: ${REDIS_ADDR}
      # Google OAuth (Gmail connector). Empty by default; when unset the Gmail
      # connector honestly reports not_implemented instead of pretending to work.
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URL: ${GOOGLE_OAUTH_REDIRECT_URL:-}
      # Per-client-IP request cap per minute; 0 disables it. Enforced through
      # Redis (REDIS_ADDR) so the count survives restarts and is shared across
      # instances. Was previously not passed through, so the limiter could never
      # be enabled regardless of .env.
      RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE}
      RUN_MODE: ${RUN_MODE}
      HAI_PROMETHEUS_ENABLED: ${HAI_PROMETHEUS_ENABLED}
      HAI_PROMETHEUS_TOKEN: ${HAI_PROMETHEUS_TOKEN}
      LLM_POLICY_JSON: ${LLM_POLICY_JSON}
      LLM_PROVIDERS_JSON: ${LLM_PROVIDERS_JSON}
      LLM_REQUIRE_RECENT_LIVE_PROBE: ${LLM_REQUIRE_RECENT_LIVE_PROBE}
      LLM_PROVIDER_PROBE_MAX_AGE_SECONDS: ${LLM_PROVIDER_PROBE_MAX_AGE_SECONDS}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL}
      LM_STUDIO_BASE_URL: ${LM_STUDIO_BASE_URL}
      LLAMA_CPP_BASE_URL: ${LLAMA_CPP_BASE_URL}
      LLAMA_CPP_MODEL_ID: ${LLAMA_CPP_MODEL_ID}
      LITELLM_ENABLED: ${LITELLM_ENABLED}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL}
      LITELLM_MODEL_ID: ${LITELLM_MODEL_ID}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}
      HAI_SEMANTIC_RETRIEVAL_ENABLED: ${HAI_SEMANTIC_RETRIEVAL_ENABLED}
      HAI_EMBEDDING_BASE_URL: ${HAI_EMBEDDING_BASE_URL}
      HAI_EMBEDDING_MODEL: ${HAI_EMBEDDING_MODEL}
      HAI_EMBEDDING_API_KEY: ${HAI_EMBEDDING_API_KEY:-}
      HAI_EMBEDDING_INPUT_LIMIT: ${HAI_EMBEDDING_INPUT_LIMIT}
      HAI_EMBEDDING_TIMEOUT_SECONDS: ${HAI_EMBEDDING_TIMEOUT_SECONDS}
      # Optional internal-only OR-Tools planner. It emits proposals only and
      # cannot apply workflow, calendar, filesystem, or external changes.
      HAI_PLANNING_OPTIMIZER_ENABLED: ${HAI_PLANNING_OPTIMIZER_ENABLED}
      HAI_PLANNING_OPTIMIZER_BASE_URL: ${HAI_PLANNING_OPTIMIZER_BASE_URL}
      HAI_PLANNING_OPTIMIZER_TIMEOUT_SECONDS: ${HAI_PLANNING_OPTIMIZER_TIMEOUT_SECONDS}
      HAI_TEMPORAL_ENABLED: ${HAI_TEMPORAL_ENABLED}
      HAI_TEMPORAL_ADDRESS: ${HAI_TEMPORAL_ADDRESS}
      HAI_TEMPORAL_NAMESPACE: ${HAI_TEMPORAL_NAMESPACE}
      HAI_TEMPORAL_TASK_QUEUE: ${HAI_TEMPORAL_TASK_QUEUE}
      HAI_PLAYWRIGHT_ENABLED: ${HAI_PLAYWRIGHT_ENABLED}
      HAI_PLAYWRIGHT_RUNNER_URL: ${HAI_PLAYWRIGHT_RUNNER_URL}
      HAI_PLAYWRIGHT_RUNNER_TOKEN: ${HAI_PLAYWRIGHT_RUNNER_TOKEN:-}
      HAI_PLAYWRIGHT_PROFILES: ${HAI_PLAYWRIGHT_PROFILES}
      HAI_SEARXNG_ENABLED: ${HAI_SEARXNG_ENABLED}
      HAI_SEARXNG_BASE_URL: ${HAI_SEARXNG_BASE_URL}
      HAI_WASI_ENABLED: ${HAI_WASI_ENABLED}
      HAI_WASI_RUNNER_URL: ${HAI_WASI_RUNNER_URL}
      HAI_WASI_RUNNER_TOKEN: ${HAI_WASI_RUNNER_TOKEN:-}
      HAI_WASI_MODULES: ${HAI_WASI_MODULES}
      ODYSSEUS_BASE_URL: ${ODYSSEUS_BASE_URL}
      ODYSSEUS_API_TOKEN: ${ODYSSEUS_API_TOKEN}
      AGENT_RUNTIME_ALLOWED_HOSTS: ${AGENT_RUNTIME_ALLOWED_HOSTS}
      AGENT_RUNTIME_OUTPUT_LIMIT_BYTES: ${AGENT_RUNTIME_OUTPUT_LIMIT_BYTES}
      AGENT_RUNTIME_WORKSPACE_ROOT: ${AGENT_RUNTIME_WORKSPACE_ROOT}
      ODYSSEUS_AGENT_ENABLED: ${ODYSSEUS_AGENT_ENABLED}
      ODYSSEUS_AGENT_SESSION_ID: ${ODYSSEUS_AGENT_SESSION_ID}
      ODYSSEUS_AGENT_WORKSPACE: ${ODYSSEUS_AGENT_WORKSPACE}
      ODYSSEUS_AGENT_TIMEOUT_SECONDS: ${ODYSSEUS_AGENT_TIMEOUT_SECONDS}
      ODYSSEUS_CODEX_BRIDGE_ENABLED: ${ODYSSEUS_CODEX_BRIDGE_ENABLED}
      ODYSSEUS_CLAUDE_BRIDGE_ENABLED: ${ODYSSEUS_CLAUDE_BRIDGE_ENABLED}
      ODYSSEUS_TODOS_ENABLED: ${ODYSSEUS_TODOS_ENABLED}
      ODYSSEUS_NOTES_ENABLED: ${ODYSSEUS_NOTES_ENABLED}
      ODYSSEUS_TASKS_ENABLED: ${ODYSSEUS_TASKS_ENABLED}
      ODYSSEUS_EMAIL_ENABLED: ${ODYSSEUS_EMAIL_ENABLED}
      ODYSSEUS_CALENDAR_ENABLED: ${ODYSSEUS_CALENDAR_ENABLED}
