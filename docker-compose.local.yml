      OPENCLAW_NODES_ENABLED: ${OPENCLAW_NODES_ENABLED}
      OPENCLAW_VOICE_ENABLED: ${OPENCLAW_VOICE_ENABLED}
      OPENCLAW_TALK_ENABLED: ${OPENCLAW_TALK_ENABLED}
