      HERMES_TOOLSETS: ${HERMES_TOOLSETS}
      HERMES_SKILLS: ${HERMES_SKILLS}
      HERMES_GATEWAY_ENABLED: ${HERMES_GATEWAY_ENABLED}
      HERMES_CRON_ENABLED: ${HERMES_CRON_ENABLED}
      HERMES_MCP_ENABLED: ${HERMES_MCP_ENABLED}
      HERMES_MOA_ENABLED: ${HERMES_MOA_ENABLED}
      HERMES_SUBAGENTS_ENABLED: ${HERMES_SUBAGENTS_ENABLED}
      HERMES_MEMORY_SYNC_ENABLED: ${HERMES_MEMORY_SYNC_ENABLED}
      HERMES_ACP_ENABLED: ${HERMES_ACP_ENABLED}
      HERMES_TERMINAL_BACKENDS: ${HERMES_TERMINAL_BACKENDS}
      HERMES_ENV_ALLOWLIST: ${HERMES_ENV_ALLOWLIST}
      OPENCLAW_AGENT_ENABLED: ${OPENCLAW_AGENT_ENABLED}
      OPENCLAW_EXECUTABLE: ${OPENCLAW_EXECUTABLE}
