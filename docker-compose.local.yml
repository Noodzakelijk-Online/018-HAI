      CONNECTED_SOURCE_HTTP_ALLOWED_HOSTS: ${CONNECTED_SOURCE_HTTP_ALLOWED_HOSTS}
      CONNECTED_SOURCE_HTTP_ALLOW_LINK_LOCAL: ${CONNECTED_SOURCE_HTTP_ALLOW_LINK_LOCAL}
      CONNECTED_SOURCE_HTTP_TIMEOUT_SECONDS: ${CONNECTED_SOURCE_HTTP_TIMEOUT_SECONDS}
      CONNECTED_SOURCE_HTTP_MAX_BYTES: ${CONNECTED_SOURCE_HTTP_MAX_BYTES}
      GITHUB_SOURCE_API_BASE_URL: ${GITHUB_SOURCE_API_BASE_URL}
      GITHUB_SOURCE_TOKEN: ${GITHUB_SOURCE_TOKEN}
      SOURCE_SCHEDULER_ENABLED: ${SOURCE_SCHEDULER_ENABLED}
      SOURCE_SCHEDULER_INTERVAL_SECONDS: ${SOURCE_SCHEDULER_INTERVAL_SECONDS}
      SOURCE_SCHEDULER_RUN_ON_STARTUP: ${SOURCE_SCHEDULER_RUN_ON_STARTUP}
      WORKFLOW_SCHEDULER_ENABLED: ${WORKFLOW_SCHEDULER_ENABLED}
      WORKFLOW_OPEN_LOOP_SCHEDULER_ENABLED: ${WORKFLOW_OPEN_LOOP_SCHEDULER_ENABLED}
      WORKFLOW_SCHEDULER_INTERVAL_SECONDS: ${WORKFLOW_SCHEDULER_INTERVAL_SECONDS}
      WORKFLOW_SCHEDULER_RUN_LIMIT: ${WORKFLOW_SCHEDULER_RUN_LIMIT}
      WORKFLOW_SCHEDULER_RUN_ON_STARTUP: ${WORKFLOW_SCHEDULER_RUN_ON_STARTUP}
      WORKFLOW_CLAIM_LEASE_SECONDS: ${WORKFLOW_CLAIM_LEASE_SECONDS}
      AMBIENT_SCHEDULER_ENABLED: ${AMBIENT_SCHEDULER_ENABLED}
      AMBIENT_EXECUTION_ENABLED: ${AMBIENT_EXECUTION_ENABLED}
      AMBIENT_RUN_ON_STARTUP: ${AMBIENT_RUN_ON_STARTUP}
      AMBIENT_SCAN_INTERVAL_SECONDS: ${AMBIENT_SCAN_INTERVAL_SECONDS}
      AMBIENT_MINIMUM_SCORE: ${AMBIENT_MINIMUM_SCORE}
      AMBIENT_MINIMUM_CONFIDENCE: ${AMBIENT_MINIMUM_CONFIDENCE}
      AMBIENT_OPPORTUNITY_LIMIT: ${AMBIENT_OPPORTUNITY_LIMIT}
      AMBIENT_EXECUTION_LIMIT: ${AMBIENT_EXECUTION_LIMIT}
      AMBIENT_DISMISS_COOLDOWN_HOURS: ${AMBIENT_DISMISS_COOLDOWN_HOURS}
      AMBIENT_SCAN_RETENTION: ${AMBIENT_SCAN_RETENTION}
      AUTONOMY_WORLD_STATE_TTL_SECONDS: ${AUTONOMY_WORLD_STATE_TTL_SECONDS}
      AUTONOMY_TELEMETRY_LIMIT: ${AUTONOMY_TELEMETRY_LIMIT}
      LLM_KV_CACHE_LOAD_STRATEGY: ${LLM_KV_CACHE_LOAD_STRATEGY}
      LLM_DUALPATH_INFRASTRUCTURE_VERIFIED: ${LLM_DUALPATH_INFRASTRUCTURE_VERIFIED}
    ports:
      - "127.0.0.1:${BACKEND_PORT}:${SERVER_PORT}"
    volumes:
      - ./images:/root/images
      - ./automation-scripts:/root/automation-scripts:ro
      - ./connected-sources:/root/connected-sources:ro
      - ./agent-workspaces:/root/agent-workspaces
    # /readyz, not a TCP probe: an open socket only proves the process is
    # listening. curl -f fails on the 503 that /readyz returns when a critical
    # dependency is unreachable, so `docker ps` stops reporting a backend with a
    # dead database as healthy.
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:${SERVER_PORT}/readyz > /dev/null"]
      interval: 10s
      timeout: 5s
      # 3 strikes (~30s) before unhealthy: long enough to ride out a dependency
      # blip, short enough that a real outage is reflected quickly. start_period
      # still covers the slower first boot while migrations run.
      retries: 3
      start_period: 40s
    networks:
      - service-hub
      - automation-hub-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: 018-hai-frontend
    hostname: frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  browser-verifier:
    build:
      context: ./services/browser-verifier
      dockerfile: Dockerfile
    profiles: ["verification"]
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    environment:
      HAI_PLAYWRIGHT_RUNNER_TOKEN: ${HAI_PLAYWRIGHT_RUNNER_TOKEN:-}
      HAI_PLAYWRIGHT_ALLOWED_ORIGINS: ${HAI_PLAYWRIGHT_ALLOWED_ORIGINS}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e 'fetch("http://127.0.0.1:8080/healthz").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))'
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    networks:
      - service-hub

  nginx:
    image: nginx:alpine
    container_name: gateway
    hostname: gateway
    restart: unless-stopped
    environment:
      BACKEND_API_SHARED_KEY: ${BACKEND_API_SHARED_KEY}
    command:
      - /bin/sh
      - -c
      - envsubst '$$BACKEND_API_SHARED_KEY' < /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_started
      idp:
        condition: service_started
    ports:
      - "${GATEWAY_HOST_BIND:-127.0.0.1}:${GATEWAY_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx-config/nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./nginx-config/sites-enabled:/etc/nginx/sites-enabled:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - service-hub

  nginxconfigmanager:
    build:
      context: ./nginx-config-manager
      dockerfile: Dockerfile
    container_name: 018-hai-nginx-config-manager
    restart: unless-stopped
    environment:
      BROKERS_ADDR: ${BROKERS_ADDR}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      KAFKA_TOPIC: ${KAFKA_TOPIC}
      NGINX_CONTAINER: ${NGINX_CONTAINER}
      CONFIG_DIR: ${CONFIG_DIR}
      NGINX_RELOAD_ENABLED: ${NGINX_RELOAD_ENABLED}
    depends_on:
      kafka:
        condition: service_healthy
      nginx:
        condition: service_started
    volumes:
      - ./nginx-config/sites-enabled:/app/sites-enabled
    networks:
      - service-hub

  ortools-solver:
    build:
      context: ./services/ortools-solver
    profiles: ["optimization"]
    restart: unless-stopped
    environment:
      MAX_SOLVE_SECONDS: ${HAI_PLANNING_OPTIMIZER_MAX_SOLVE_SECONDS:-2}
    expose:
      - "8080"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - service-hub

  wasi-runner:
    build:
      context: ./services/wasi-runner
    profiles: ["wasi"]
    restart: unless-stopped
    environment:
      HAI_WASI_RUNNER_TOKEN: ${HAI_WASI_RUNNER_TOKEN:-}
    volumes:
      - ./wasi-modules:/modules:ro
    read_only: true
    tmpfs:
      - /tmp
    mem_limit: 256m
    cpus: 0.5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD-SHELL", "python -c \"from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=2).read()\""]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - service-hub

  # Optional, internal-only durable orchestration. It is intentionally split
  # from HAI's primary Postgres instance and is enabled only with
  # `--profile durability`. No Temporal port is exposed to the host.
  temporal-postgres:
    image: postgres:17-alpine
    profiles: ["durability"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_DB: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal -d temporal"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - service-hub

  temporal-schema:
    image: temporalio/admin-tools:1.31.2
    profiles: ["durability"]
    restart: "no"
    depends_on:
      temporal-postgres:
        condition: service_healthy
    environment:
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
      SQL_PASSWORD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
    volumes:
      - ./services/temporal/setup-postgres.sh:/scripts/setup-postgres.sh:ro
    entrypoint: ["/bin/sh", "/scripts/setup-postgres.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - service-hub

  temporal:
    image: temporalio/server:1.31.2
    profiles: ["durability"]
    restart: unless-stopped
    depends_on:
      temporal-schema:
        condition: service_completed_successfully
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: ${HAI_TEMPORAL_POSTGRES_PASSWORD:-temporal-local-only}
      POSTGRES_SEEDS: temporal-postgres
      BIND_ON_IP: 0.0.0.0
      DYNAMIC_CONFIG_FILE_PATH: config/dynamicconfig/development-sql.yaml
    expose:
      - "7233"
    volumes:
      - ./services/temporal/dynamicconfig:/etc/temporal/config/dynamicconfig:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "7233"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - service-hub

  temporal-namespace:
    image: temporalio/admin-tools:1.31.2
    profiles: ["durability"]
    restart: "no"
    depends_on:
      temporal:
        condition: service_healthy
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      DEFAULT_NAMESPACE: ${HAI_TEMPORAL_NAMESPACE:-default}
    volumes:
      - ./services/temporal/create-namespace.sh:/scripts/create-namespace.sh:ro
    entrypoint: ["/bin/sh", "/scripts/create-namespace.sh"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - service-hub

  postgres-idp:
    image: postgres:17-alpine
    container_name: 018-hai-postgres-idp
    hostname: postgres-idp
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${IDP_DB_NAME}
    ports:
      - "127.0.0.1:${IDP_DB_HOST_PORT:-5433}:5432"
    volumes:
      - postgres-idp-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${IDP_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - idp-network

  postgres-automation:
    # Pinned upstream pgvector Postgres 17 image. Existing data stays in the
    # named volume; take a backup before changing a live database image.
    image: pgvector/pgvector:0.8.5-pg17-bookworm
    container_name: 018-hai-postgres-automation
    hostname: postgres-automation
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${AUTOMATION_DB_NAME}
    ports:
      - "127.0.0.1:${AUTOMATION_DB_HOST_PORT:-5434}:5432"
    volumes:
      - postgres-automation-data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${AUTOMATION_DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - automation-hub-network

  redis:
    image: redis:7-alpine
    container_name: 018-hai-redis
    hostname: redis
    restart: unless-stopped
    command: ["redis-server", "--port", "${REDIS_PORT}"]
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:${REDIS_PORT}"
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "${REDIS_PORT}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      # Also on automation-hub-network so the backend can reach it: Redis was
      # previously idp-network only, unreachable from the backend, which is why
      # nothing but the IDP ever used it.
      - idp-network
      - automation-hub-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    container_name: 018-hai-zookeeper
    restart: unless-stopped
    environment:
      ZOOKEEPER_CLIENT_PORT: ${ZOOKEEPER_PORT}
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD-SHELL", "nc -z 127.0.0.1 ${ZOOKEEPER_PORT}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - kafka-network

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: 018-hai-kafka
    hostname: kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:${ZOOKEEPER_PORT}
      KAFKA_LISTENERS: INTERNAL://:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server 127.0.0.1:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 18
      start_period: 30s
    networks:
      - kafka-network
      - service-hub

  generic-auto:
    build:
      context: ./generic-auto
      dockerfile: dockerfile
    container_name: 018-hai-generic-auto
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - service-hub

networks:
  idp-network:
    name: 018-hai-idp-network
    driver: bridge
  kafka-network:
    name: 018-hai-kafka-network
    driver: bridge
  automation-hub-network:
    name: 018-hai-automation-hub-network
    driver: bridge
  service-hub:
    name: 018-hai-service-hub
    driver: bridge

volumes:
  postgres-idp-data:
    name: 018-hai-postgres-idp-data
  postgres-automation-data:
    name: 018-hai-postgres-automation-data
  temporal-postgres-data:
    name: 018-hai-temporal-postgres-data
