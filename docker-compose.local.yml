      OPENCLAW_EXEC_APPROVALS_ENABLED: ${OPENCLAW_EXEC_APPROVALS_ENABLED}
      OPENCLAW_HOST_TOOLS_ENABLED: ${OPENCLAW_HOST_TOOLS_ENABLED}
      OPENCLAW_PUBLIC_POSTING_ENABLED: ${OPENCLAW_PUBLIC_POSTING_ENABLED}
      OPENCLAW_WEB_SEARCH_ENABLED: ${OPENCLAW_WEB_SEARCH_ENABLED}
      OPENCLAW_MULTI_AGENT_ENABLED: ${OPENCLAW_MULTI_AGENT_ENABLED}
      OPENCLAW_APP_SDK_ENABLED: ${OPENCLAW_APP_SDK_ENABLED}
      OPENCLAW_PLUGIN_SDK_ENABLED: ${OPENCLAW_PLUGIN_SDK_ENABLED}
      OPENCLAW_LOCAL_MODELS_ENABLED: ${OPENCLAW_LOCAL_MODELS_ENABLED}
      OPENCLAW_ALLOW_HIGH_RISK_EXECUTION: ${OPENCLAW_ALLOW_HIGH_RISK_EXECUTION}
      OPENCLAW_SANDBOX_REQUIRED: ${OPENCLAW_SANDBOX_REQUIRED}
      OPENCLAW_SANDBOX_MODE: ${OPENCLAW_SANDBOX_MODE}
      OPENCLAW_SANDBOX_DOCKER_ENABLED: ${OPENCLAW_SANDBOX_DOCKER_ENABLED}
      OPENCLAW_SANDBOX_SSH_ENABLED: ${OPENCLAW_SANDBOX_SSH_ENABLED}
      OPENCLAW_SANDBOX_OPENSHELL_ENABLED: ${OPENCLAW_SANDBOX_OPENSHELL_ENABLED}
      OPENCLAW_CHANNELS_ENABLED: ${OPENCLAW_CHANNELS_ENABLED}
      OPENCLAW_PROVIDERS_ENABLED: ${OPENCLAW_PROVIDERS_ENABLED}
      OPENCLAW_COMPANION_APPS: ${OPENCLAW_COMPANION_APPS}
