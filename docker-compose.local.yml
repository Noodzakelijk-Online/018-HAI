      HAI_MCP_PREFLIGHT_ENABLED: ${HAI_MCP_PREFLIGHT_ENABLED}
      HAI_MCP_PREFLIGHT_SERVERS: ${HAI_MCP_PREFLIGHT_SERVERS}
      HAI_MCP_PREFLIGHT_TIMEOUT_SECONDS: ${HAI_MCP_PREFLIGHT_TIMEOUT_SECONDS}
      LLM_ALLOW_LINK_LOCAL_ENDPOINTS: ${LLM_ALLOW_LINK_LOCAL_ENDPOINTS}
      AUTOMATION_API_ALLOWED_HOSTS: ${AUTOMATION_API_ALLOWED_HOSTS}
      AUTOMATION_API_ALLOW_LINK_LOCAL: ${AUTOMATION_API_ALLOW_LINK_LOCAL}
      AUTOMATION_HEALTH_ALLOWED_HOSTS: ${AUTOMATION_HEALTH_ALLOWED_HOSTS}
      AUTOMATION_HEALTH_ALLOW_LINK_LOCAL: ${AUTOMATION_HEALTH_ALLOW_LINK_LOCAL}
      AUTOMATION_SCRIPT_EXECUTION_ENABLED: ${AUTOMATION_SCRIPT_EXECUTION_ENABLED}
      AUTOMATION_SCRIPT_DIR: ${AUTOMATION_SCRIPT_DIR}
      AUTOMATION_SCRIPT_TIMEOUT_SECONDS: ${AUTOMATION_SCRIPT_TIMEOUT_SECONDS}
      AUTOMATION_SCRIPT_ENV_ALLOWLIST: ${AUTOMATION_SCRIPT_ENV_ALLOWLIST}
      AUTOMATION_SCRIPT_SHA256_ALLOWLIST: ${AUTOMATION_SCRIPT_SHA256_ALLOWLIST}
      AUTOMATION_DOCKER_CONTROL_ENABLED: ${AUTOMATION_DOCKER_CONTROL_ENABLED}
      AUTOMATION_DOCKER_SOCKET: ${AUTOMATION_DOCKER_SOCKET}
