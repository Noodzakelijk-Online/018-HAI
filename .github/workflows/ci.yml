name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows-installer:
    name: Windows installer build
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum
      - name: Installer payload and safety contract
        shell: pwsh
        run: ./scripts/test-windows-installer-contract.ps1
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build Windows installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version "ci-$($env:GITHUB_SHA.Substring(0, 7))"
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: hai-windows-installer
          path: installer/release/HAI-Setup-*.exe
          if-no-files-found: error
          retention-days: 14

  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum
      - run: go vet ./...
      - run: go test ./...
      - name: Execution-boundary race tests
        # Keep concurrency coverage limited to stateful boundary packages. This
        # catches duplicate lease, approval, model-refresh, source-sync, and
        # runtime-registration races without making every CI package pay the
        # race-detector cost.
        run: go test -count=1 -race ./internal/automation ./internal/task ./internal/source ./internal/llm ./internal/agentruntime ./internal/durablejob
      - run: go build ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  idp:
    name: IDP build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: idp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: idp/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  nginx-config-manager:
    name: Nginx config manager build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nginx-config-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: nginx-config-manager/go.sum
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...

  frontend:
    name: Frontend build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      # Unit tests run in headless Chrome (preinstalled on ubuntu-latest) via the
      # sandbox-free launcher in karma.conf.js.
      - name: Unit tests (headless Chrome)
        run: npx ng test --watch=false --browsers=ChromeHeadlessNoSandbox
      # The production dependency graph is currently clean. Keep this as a
      # hard gate so a newly disclosed high-severity runtime advisory cannot
      # quietly reach a Windows installer or hosted deployment. The npm audit
      # API occasionally returns a transient 5xx; retry it briefly without
      # converting a confirmed advisory into a passing build.
      - name: Production dependency audit
        run: |
          for attempt in 1 2 3; do
            if timeout 90s npm audit --omit=dev --audit-level=high; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              exit 1
            fi
            echo "npm audit failed; retrying after a short delay ($attempt/3)."
            sleep $((attempt * 10))
          done

  browser-acceptance:
    name: Browser acceptance (real Compose stack)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/e2e/package-lock.json
      - name: Create isolated production-like environment
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          values = {
              "COMPOSE_PROJECT_NAME": "hai-browser-acceptance",
              "GATEWAY_HOST_BIND": "127.0.0.1",
              "GATEWAY_HOST_PORT": "8080",
              "RUN_MODE": "production",
              "DB_PASSWORD": "a4f6bc91d0e32b7c8a5f49d6e0c12b34",
              "BACKEND_DB_USER": "hai_runtime",
              "BACKEND_DB_PASSWORD": "bc49e5a12f0d36c87b5a9e0d41c2f638",
              "BACKEND_API_SHARED_KEY": "c5a98e3d0f42b7619ce0a34d8b6f1270",
              "HAI_MEMORY_ENCRYPTION_KEY": "d8a72f1c0e469b35a8f02d7c16e94b5f",
              "JWT_SECRET": "e1c93b5a74d0f6281a5e9c03b7f2468d",
              "HAI_APPROVAL_PROOF_SIGNING_KEY": "f4d8a2c9e0b31576d9c4a1f8b20e6735",
              "FIRST_RUN_ADMIN_EMAIL": "e2e-owner@example.test",
              "FIRST_RUN_ADMIN_PASSWORD": "E2eLocalOwnerPassword!2026",
              "DB_MIGRATIONS_ENABLED": "false",
              "LOCAL_LOGIN_BYPASS_ENABLED": "false",
              "HAI_EVENT_BUS_ENABLED": "false",
              "SOURCE_SCHEDULER_ENABLED": "false",
              "WORKFLOW_SCHEDULER_ENABLED": "false",
              "AMBIENT_SCHEDULER_ENABLED": "false",
          }
          content = Path(".env.example").read_text(encoding="utf-8")
          for key, value in values.items():
              content, replacements = re.subn(
                  rf"(?m)^{re.escape(key)}=.*$", f"{key}={value}", content
              )
              if replacements != 1:
                  raise SystemExit(f"expected exactly one {key} entry, got {replacements}")
          Path(".env.browser-acceptance").write_text(content, encoding="utf-8")
          PY
      - name: Start isolated HAI stack
        run: |
          docker compose --env-file .env.browser-acceptance -f docker-compose.local.yml up -d --build --wait --wait-timeout 240
          for attempt in $(seq 1 60); do
            readyz_http="$(curl -sS -o readyz.json -w '%{http_code}' http://127.0.0.1:8080/readyz || true)"
            if [ "${readyz_http}" = "200" ]; then
              python3 -c 'import json; from pathlib import Path; status = json.loads(Path("readyz.json").read_text(encoding="utf-8")).get("status"); assert status in {"ready", "degraded"}, f"unexpected readiness status: {status!r}"'
              exit 0
            fi
            sleep 2
          done
          echo "HAI did not become ready"
          exit 1
      - name: Install browser acceptance dependencies
        working-directory: frontend/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run browser acceptance
        working-directory: frontend/e2e
        env:
          E2E_BASE_URL: http://127.0.0.1:8080
          E2E_OPERATOR_EMAIL: e2e-owner@example.test
          E2E_OPERATOR_PASSWORD: E2eLocalOwnerPassword!2026
          E2E_ALLOW_MUTATION: "true"
        run: npm test
      - name: Compose diagnostics on failure
        if: failure()
        run: |
          docker compose --env-file .env.browser-acceptance -f docker-compose.local.yml ps
          docker compose --env-file .env.browser-acceptance -f docker-compose.local.yml logs --no-color \
            backend-migrate backend-runtime-role backend idp gateway || true
      - name: Remove isolated HAI stack
        if: always()
        run: docker compose --env-file .env.browser-acceptance -f docker-compose.local.yml down -v --remove-orphans

  compose:
    name: Gateway and local Compose validation
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: CI workflow contract
        run: python3 scripts/test_ci_contract.py
      - name: No-fake claims and tracked-artifact audit
        run: bash scripts/no-fake-claims-audit.sh
      - name: Gateway authentication contract
        run: python3 nginx-config/test_gateway_contract.py
      - run: docker compose --env-file .env.example -f docker-compose.local.yml config
      - name: Provider fixture Compose contract
        run: docker compose --env-file .env.example --profile provider-fixture -f docker-compose.local.yml config --quiet
      - name: Nginx syntax
        run: |
          python3 - "$RUNNER_TEMP/hai-nginx.conf" <<'PY'
          from pathlib import Path
          import sys
          source = Path("nginx-config/nginx.conf.template").read_text(encoding="utf-8")
          Path(sys.argv[1]).write_text(
              source.replace("${BACKEND_API_SHARED_KEY}", "ci-test-key"),
              encoding="utf-8",
          )
          PY
          docker run --rm \
            -v "$RUNNER_TEMP/hai-nginx.conf:/etc/nginx/nginx.conf:ro" \
            -v "$PWD/nginx-config/sites-enabled:/etc/nginx/sites-enabled:ro" \
            nginx:alpine nginx -t

  provider-fixture:
    name: Local provider fixture HTTP contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and exercise isolated fixture
        run: bash scripts/smoke-provider-fixture.sh

  authenticated-smoke:
    name: Authenticated control-plane smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum
      - name: Smoke authentication contract
        run: python3 scripts/test_smoke_auth_contract.py
      - name: Install smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq postgresql postgresql-client
          echo "$(pg_config --bindir)" >> "$GITHUB_PATH"
      - name: Run authenticated smoke suites
        run: |
          set -euo pipefail
          smoke_log="$RUNNER_TEMP/authenticated-smoke.log"
          bash scripts/smoke-all.sh | tee "$smoke_log"
          expected_suites=(
            smoke-background-operations
            smoke-model-intelligence
            smoke-runtime-lab
            smoke-account-bridges
            smoke-windows-runtime
          )
          for suite in "${expected_suites[@]}"; do
            if ! grep -Eq "^  PASS  ${suite}  \(Result: [1-9][0-9]* passed, 0 failed\)$" "$smoke_log"; then
              echo "::error::Authenticated smoke suite ${suite} did not emit passing result evidence."
              exit 1
            fi
          done
          grep -qx '==> ALL PHASE 2 SMOKE SUITES PASSED' "$smoke_log"

  # Runs the versioned migration runner and Framework Registry persistence tests
  # against a real Postgres 17 service. Integration-tagged checks do not run as
  # part of the default backend unit-test job.
  migrations-integration:
    name: Migration integration (real Postgres 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum
      - name: Create isolated integration databases
        env:
          PGPASSWORD: postgres
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          for database in \
            hai_migration_runner_test \
            hai_framework_registry_test \
            hai_task_state_test \
            hai_agent_registry_test
          do
            createdb \
              --host=127.0.0.1 \
              --port=5432 \
              --username=postgres \
              "${database}"
          done
      - name: Migration, Framework Registry, and task-state persistence tests
        env:
          HAI_ALLOW_DESTRUCTIVE_DATABASE_TESTS: "true"
          HAI_REQUIRE_POSTGRES_INTEGRATION: "true"
        run: |
          set -euo pipefail
          infra_log="$RUNNER_TEMP/migration-infra.log"
          registry_log="$RUNNER_TEMP/framework-registry-postgres.log"
          task_log="$RUNNER_TEMP/task-state-postgres.log"
          agent_registry_log="$RUNNER_TEMP/agent-registry-postgres.log"
          execution_auth_log="$RUNNER_TEMP/execution-authorization-postgres.log"
          migration_dsn="host=localhost user=postgres password=postgres dbname=hai_migration_runner_test port=5432 sslmode=disable TimeZone=UTC"
          registry_dsn="host=localhost user=postgres password=postgres dbname=hai_framework_registry_test port=5432 sslmode=disable TimeZone=UTC"
          task_dsn="host=localhost user=postgres password=postgres dbname=hai_task_state_test port=5432 sslmode=disable TimeZone=UTC"
          agent_registry_dsn="host=localhost user=postgres password=postgres dbname=hai_agent_registry_test port=5432 sslmode=disable TimeZone=UTC"
          HAI_TEST_DATABASE_DSN="$migration_dsn" go test -count=1 -tags integration \
            -run '^(TestConcurrentMigrationRunnersSerializeAndRecheck|TestLegacyBaselineRejectsDifferentExistingPrimaryKey|TestRunMigrationsAppliesAndIsIdempotent|TestRollbackMigrationReversesPostMigration)$' \
            ./internal/infra/ -v | tee "$infra_log"
          grep -q -- '^--- PASS: TestConcurrentMigrationRunnersSerializeAndRecheck' "$infra_log"
          grep -q -- '^--- PASS: TestLegacyBaselineRejectsDifferentExistingPrimaryKey' "$infra_log"
          grep -q -- '^--- PASS: TestRunMigrationsAppliesAndIsIdempotent' "$infra_log"
          grep -q -- '^--- PASS: TestRollbackMigrationReversesPostMigration' "$infra_log"
          HAI_TEST_DATABASE_DSN="$registry_dsn" go test -count=1 -tags integration \
            ./internal/frameworkregistry/ -v | tee "$registry_log"
          grep -q -- '^--- PASS: TestFrameworkRegistryPostgresIntegrationRequiredEnvironment' "$registry_log"
          grep -q -- '^--- PASS: TestFrameworkRegistryPostgresMigrationApplyRollbackAndRerun' "$registry_log"
          grep -q -- '^--- PASS: TestFrameworkRegistryPostgresConstraintsAndImmutability' "$registry_log"
          HAI_TEST_DATABASE_DSN="$task_dsn" go test -count=1 -tags integration \
            -run '^TestPostgresTaskStateRepositoryDurabilityOwnerScopeAndImmutability$' \
            ./internal/task/ -v | tee "$task_log"
          grep -q -- '^--- PASS: TestPostgresTaskStateRepositoryDurabilityOwnerScopeAndImmutability' "$task_log"
          HAI_TEST_DATABASE_DSN="$migration_dsn" go test -count=1 \
            -run '^TestPostgresReceiptPersistsOwnerSafePolymorphicApprovals$' \
            ./internal/executionauth/ -v | tee "$execution_auth_log"
          grep -q -- '^--- PASS: TestPostgresReceiptPersistsOwnerSafePolymorphicApprovals' "$execution_auth_log"
          HAI_TEST_DATABASE_DSN="$agent_registry_dsn" go test -count=1 \
            -run '^(TestPostgresRepositoryRoundTripOwnerIsolationCASAndImmutableLedgers|TestPostgresAgentRegistryMigrationCanReplayAgainstExistingSchema)$' \
            ./internal/agentregistry/ -v | tee "$agent_registry_log"
          grep -q -- '^--- PASS: TestPostgresRepositoryRoundTripOwnerIsolationCASAndImmutableLedgers' "$agent_registry_log"
          grep -q -- '^--- PASS: TestPostgresAgentRegistryMigrationCanReplayAgainstExistingSchema' "$agent_registry_log"

  # Boots the real backend against a real Postgres + Redis and runs the
  # two-account isolation acceptance test over HTTP: two authenticated owners
  # must not see, retrieve, or act on each other's sources or extracted content.
  # This is a running-stack proof, not an in-process fake.
  isolation-acceptance:
    name: Two-account isolation (running stack)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: automation_hub
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25.13"
          cache-dependency-path: backend/go.sum
      - name: Build backend
        working-directory: backend
        run: CGO_ENABLED=1 go build -o hai-backend ./cmd/main.go
      - name: Start backend against real Postgres + Redis
        working-directory: backend
        env:
          DB_HOST: localhost
          DB_PORT: "5432"
          DB_USER: postgres
          DB_PASSWORD: postgres
          DB_NAME: automation_hub
          # The explicit versioned migration runner owns the CI schema too.
          # AutoMigrate is deliberately limited to local, pre-migration model
          # scaffolding and must not alter an already-migrated database.
          DB_AUTOMIGRATE: "false"
          JWT_SECRET: devsecret
          BACKEND_API_SHARED_KEY: ci-backend-api-shared-key-0123456789
          HAI_MEMORY_ENCRYPTION_KEY: ci-memory-encryption-key-0123456789
          # Production-mode startup requires a non-placeholder approval proof
          # key. This is a test-only value; production uses a generated secret.
          HAI_APPROVAL_PROOF_SIGNING_KEY: ci-approval-proof-signing-key-0123456789
          SERVER_PORT: "8080"
          REDIS_ADDR: localhost:6379
          # Keep the acceptance run deterministic: no background schedulers.
          SOURCE_SCHEDULER_ENABLED: "false"
          WORKFLOW_SCHEDULER_ENABLED: "false"
          AMBIENT_SCHEDULER_ENABLED: "false"
        run: |
          ./hai-backend > backend.log 2>&1 &
          echo $! > backend.pid
          backend_live=""
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/healthz >/dev/null; then
              backend_live=1
              echo "backend live after ${i}s"
              break
            fi
            if ! kill -0 "$(cat backend.pid)" 2>/dev/null; then
              echo "backend exited before becoming live"
              cat backend.log
              exit 1
            fi
            sleep 1
          done
          [ -n "${backend_live}" ] || {
            echo "backend never became live"
            cat backend.log
            exit 1
          }
          readyz_http="$(curl -sS -o readyz.json -w '%{http_code}' http://localhost:8080/readyz)"
          echo "readyz HTTP ${readyz_http}"
          cat readyz.json
          [ "${readyz_http}" = "200" ] || {
            echo "backend readiness endpoint did not return HTTP 200"
            exit 1
          }
          python3 - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("readyz.json").read_text(encoding="utf-8")).get("status")
          if status not in {"ready", "degraded"}:
              raise SystemExit(f"backend readiness status is not operational: {status!r}")
          PY
      - name: Two-account isolation acceptance test
        env:
          HAI_BASE_URL: http://localhost:8080
          HAI_JWT_SECRET: devsecret
          HAI_BACKEND_API_SHARED_KEY: ci-backend-api-shared-key-0123456789
        run: bash scripts/two-account-isolation-test.sh
      - name: Backend log (on failure)
        if: failure()
        run: cat backend/backend.log || true

  windows-contract:
    name: Windows CI and smoke path contract
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python CI and authentication contracts
        shell: pwsh
        run: |
          python scripts/test_ci_contract.py
          python scripts/test_smoke_auth_contract.py
          python nginx-config/test_gateway_contract.py
      - name: Git Bash syntax and space-containing path
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $bash = "C:\Program Files\Git\bin\bash.exe"
          if (-not (Test-Path -LiteralPath $bash)) {
            throw "Git Bash is unavailable at $bash"
          }
          $scripts = Get-ChildItem -LiteralPath scripts -Filter "*.sh"
          foreach ($script in $scripts) {
            & $bash -n -- $script.FullName
            if ($LASTEXITCODE -ne 0) {
              throw "Bash syntax failed for $($script.FullName)"
            }
          }
          $spacedDirectory = Join-Path $env:RUNNER_TEMP "HAI smoke path with spaces"
          New-Item -ItemType Directory -Force -Path $spacedDirectory | Out-Null
          $spacedHelper = Join-Path $spacedDirectory "smoke-auth.sh"
          Copy-Item -LiteralPath "scripts\smoke-auth.sh" -Destination $spacedHelper
          $helperForBash = (& $bash -lc "cygpath -u '$spacedHelper'").Trim()
          $bashCommand = 'python3() { python "$@"; }; source ' +
            "'$helperForBash'" +
            '; hai_smoke_mint_jwt owner ci-secret windows-owner >/dev/null'
          & $bash -lc $bashCommand
          if ($LASTEXITCODE -ne 0) {
            throw "Signed-session helper failed from a space-containing Windows path"
          }
