name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: backend/go.sum
      - run: go test ./...
      - run: go build ./...

  idp:
    name: IDP build and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: idp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: idp/go.sum
      - run: sudo apt-get update && sudo apt-get install -y build-essential pkg-config
      - run: go test ./...
      - run: go build ./...

  nginx-config-manager:
    name: Nginx config manager build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nginx-config-manager
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21.x"
          cache-dependency-path: nginx-config-manager/go.sum
      - run: go test ./...
      - run: go build ./...

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    name: Local Compose validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example -f docker-compose.local.yml config
