worker_processes 1;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 256;
}
http {
    access_log /dev/stdout;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;
    resolver 127.0.0.11 valid=10s;
    resolver_timeout 5s;
    server {
        listen 8080;

        # Resolve Docker service names per request so replacing a container
        # cannot leave the gateway pinned to its former IP address.
        set $backend_upstream backend:80;
        set $idp_upstream idp:8080;
        set $frontend_upstream frontend:8080;
        set $generic_auto_upstream generic-auto:8080;

        # Health endpoints are intentionally unauthenticated and must not fall
        # through to the Angular single-page application.
        location = /healthz {
            proxy_pass http://$backend_upstream;
        }

        location = /readyz {
            proxy_pass http://$backend_upstream;
        }



        location = /api/v1/agent-runtimes/openclaw/ecosystem/upload {
            client_max_body_size 800m;
            proxy_request_buffering off;
            auth_request /auth-verify;
            proxy_pass http://$backend_upstream;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-HAI-Backend-Key change-this-local-backend-key;
        }

        location ~ ^/api/v1/(a2a|account-feeds|agent-cycle|agent-runtimes|ambient|anythingllm|assistant|automation|autonomy|background|brain-catalog|browser-verification|deepeval|deepteam|evidence-packs|evidently|flags|framework-registry|garak|guardrails|hardware|langfuse|llm|lm-eval|mcp-bridge|mcp-preflight|memory|memory-engine|model-intelligence|operations|os|planning-optimizer|power|presidio|privacy|promptfoo|pursuits|pydantic-ai|ragflow|research|runtime-lab|serena|sources|system|task|temporal|verification|wasi|windows-runtime|workflow)(/|$) {
            auth_request /auth-verify;
            proxy_pass http://$backend_upstream;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-HAI-Backend-Key change-this-local-backend-key;
        }

        location /api/v1 {
            proxy_pass http://$idp_upstream;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        location /auth-verify {
            proxy_pass http://$idp_upstream/api/v1/auth/is-user-authenticated;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Cookie $http_cookie;
        }

        error_page 401 /login;


        include /etc/nginx/sites-enabled/*.conf;

        location / {
            proxy_pass http://$frontend_upstream;
        }
    }
}
