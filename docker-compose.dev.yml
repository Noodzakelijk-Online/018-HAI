# Development-safe override for the canonical source-built stack.
#
# Use with:
#   docker compose --env-file .env.local -f docker-compose.local.yml -f docker-compose.dev.yml up --build
#
# HAI keeps its normal loopback-only gateway and does not publish databases,
# Redis, or an unauthenticated database browser for development convenience.
# The backend Docker image is still the build authority; source mounts are not
# used because they can replace the compiled production binary with host files.
services:
  backend:
    environment:
      GIN_MODE: debug

